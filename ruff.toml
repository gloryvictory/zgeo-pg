# Конфигурация линтера ZGeo-PG.
#
# Pyflakes (F) ловит настоящие ошибки — неопределённые имена, неиспользуемые
# импорты, повторные определения — и не навязывает стиль. E9 — синтаксис.
# Логика вроде «относительный импорт указывает на существующее имя» проверяется
# тестами в tests/test_structure.py: pyflakes этого не умеет.
target-version = "py39"

[lint]
select = ["E9", "F"]

[lint.per-file-ignores]
# __init__.py намеренно импортирует плагин внутри classFactory, чтобы QGIS не
# тянул panel.py при загрузке пакета.
"__init__.py" = ["F401"]
